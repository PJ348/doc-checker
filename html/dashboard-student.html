<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Student</title>
    <link href="../src/output.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=more_vert" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
        rel="stylesheet">
</head>

<body style="font-family: 'Sarabun', sans-serif;" class=" bg-[#eaf1f8] min-h-screen p-6 md:p-10 relative">

    <!-- Main Container -->
    <div class="max-w-8xl mx-auto bg-white rounded-[2rem] shadow-xl overflow-hidden mt-2 min-h-[700px]">

        <!-- Dark Blue Top Bar -->
        <div class="bg-[#213f8c] h-14 md:h-16 w-full flex items-center justify-end px-6 md:px-8">
            <!-- รูปโปรไฟล์ -->
            <div id="profile-menu-container" class="relative">
            </div>
        </div>

        <!-- Header Section -->
        <div class="pt-12 pb-10 px-8 text-center">
            <h1 class="text-3xl md:text-4xl font-bold text-[#213f8c] mb-8">AI Document Format Checker</h1>

            <!-- Create Project Button -->
            <button id="create-project-btn"
                class="relative flex items-center justify-center mx-auto w-full max-w-[500px] h-12 bg-[#213f8c] rounded-full hover:bg-[#082570] transition-colors group overflow-hidden">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3"
                    stroke="currentColor" class="w-5 h-5 text-white absolute left-8">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
                <span class="text-base font-bold text-white z-10">สร้างโครงงาน</span>
            </button>

        </div>

        <!-- Projects Section -->
        <div class="px-8 md:px-16 pb-16">
            <h2 class="text-xl font-bold text-gray-900 mb-6">โครงงานของฉัน</h2>

            <!-- Grid Container -->
            <div id="project-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            </div>
        </div>
    </div>

    <div id="project-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4">
        <div class="w-full max-w-[540px] bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col">

            <!-- Modal Header -->
            <div class="flex items-center justify-between px-8 pt-6 ">
                <div class="flex items-center gap-3">

                    <div class=" text-white p-2 rounded-lg flex items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" height="35px" viewBox="0 -960 960 960" width="35px"
                            fill="#1E3A8A">
                            <path
                                d="M557.13-311.33h67.59v-86.21h86.2v-67.59h-86.2v-86.2h-67.59v86.2h-86.21v67.59h86.21v86.21ZM158.57-158.67q-32.52 0-56.21-23.65-23.69-23.66-23.69-56.25v-482.86q0-32.59 23.69-56.25 23.69-23.65 56.21-23.65h226.17l87.59 87.59h329.1q32.59 0 56.25 23.65 23.65 23.66 23.65 56.24v395.28q0 32.59-23.65 56.25-23.66 23.65-56.25 23.65H158.57Zm0-67.59h642.86q5.39 0 8.85-3.46t3.46-8.85v-395.28q0-5.38-3.46-8.84t-8.85-3.46H444.85l-87.59-87.59H158.57q-5.39 0-8.85 3.46t-3.46 8.85v482.86q0 5.39 3.46 8.85t8.85 3.46Zm-12.31 0v-507.48V-226.26Z" />
                        </svg>
                    </div>
                    <h2 class="text-xl font-bold text-gray-800">สร้างโครงงานใหม่</h2>
                </div>

                <button id="close-modal-btn" class="text-gray-400 hover:text-gray-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                        fill="#1f1f1f">
                        <path
                            d="M256-213.85 213.85-256l224-224-224-224L256-746.15l224 224 224-224L746.15-704l-224 224 224 224L704-213.85l-224-224-224 224Z" />
                    </svg>
                </button>
            </div>

            <div class="p-8">
                <form id="create-project-form" class="flex flex-col gap-5">

                    <div>
                        <label class="block text-[14px] text-gray-700 font-medium mb-2">ชื่อโครงงาน (ภาษาไทย) <span
                                class="text-red-500">*</span> <span id="thai-title_error" class="text-red-500 text-xs mt-1 hidden">กรุณากรอกชื่อโครงงาน</span></label>
                        <input type="text" id="thai-title" placeholder="เช่น การพัฒนาระบบตรวจสอบรูปแบบเอกสารด้วย AI"
                            class="w-full text-[12px] border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#2C5282] focus:border-transparent transition-all"
                            >
                    </div>

                    <div>
                        <label class="block text-[14px] text-gray-700 font-medium mb-2">ชื่อโครงงาน (ภาษาอังกฤษ) <span id="eng-title_error" class="text-red-500 text-xs mt-1 hidden">กรุณากรอกชื่อโครงงานเป็นภาษาอังกฤษ</span></label>
                        <input type="text" id="eng-title"
                            placeholder="e.g., Development of AI Document Format Checker System"
                            class="w-full text-[12px] border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#2C5282] focus:border-transparent transition-all">
                    </div>

                    <div>
                        <label class="block text-[14px] text-gray-700 font-medium mb-2">ปีการศึกษา (พ.ศ.) <span
                                class="text-red-500">*</span> <span id="academic-year_error" class="text-red-500 text-xs mt-1 hidden">กรุณากรอกปีการศึกษา</span></label>
                        <input type="text" id="academic-year"
                            placeholder="เช่น 2569"
                            class="w-full text-[12px] border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#2C5282] focus:border-transparent transition-all"
                            >
                    </div> 

                    <div>
                        <label class="block text-[14px] text-gray-700 font-medium mb-2">อาจารย์ที่ปรึกษา (อีเมล) <span
                                class="text-red-500">*</span> <span id="advisor-email_error" class="text-red-500 text-xs mt-1 hidden">กรุณากรอกอีเมลอาจารย์ที่ปรึกษา</span></label>
                        <input type="text" id="advisor-email" placeholder="เช่น teacher@university.ac.th"
                            class="w-full text-[12px] border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#2C5282] focus:border-transparent transition-all">
                            <p class="text-xs text-gray-400 mt-1">* หากมีหลายคน ให้พิมพ์ลูกน้ำ (,) คั่นระหว่างอีเมล</p>
                    </div>

                    <div>
                        <label
                            class="block text-[14px] text-gray-700 font-medium mb-2">เพิ่มสมาชิกในทีม <span id="team-email_error" class="text-red-500 text-xs mt-1 hidden">กรุณากรอกอีเมลอาจารย์ที่ปรึกษา</span></label>
                        <input type="text" id="team-emails" placeholder="เช่น student1@mail.com, student2@mail.com"
                            class="w-full text-[12px] border border-gray-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#2C5282] focus:border-transparent transition-all">
                        <p class="text-xs text-gray-400 mt-1">* หากมีหลายคน ให้พิมพ์ลูกน้ำ (,) คั่นระหว่างอีเมล</p>
                    </div>
                    <span id="some-email-notfound" class="text-red-500 text-xs hidden">มีอีเมลบางคนยังไม่ได้สมัครสมาชิก ระบบจะเพิ่มเฉพาะคนที่มีบัญชีเท่านั้น</span>

                    <div class="flex justify-end gap-4 mt-4">
                        <button type="button" id="cancel-btn"
                            class="px-8 py-2.5 bg-white text-gray-700 font-semibold rounded-xl hover:bg-gray-100 transition-colors text-sm cursor-pointer">
                            ยกเลิก
                        </button>
                        <button type="submit" id="submit-project-btn"
                            class="px-8 py-2.5 bg-[#213f8c] text-white font-semibold rounded-xl hover:bg-[#082570] transition-colors text-sm cursor-pointer">
                            สร้างโครงงาน
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- <script src="../node_modules/@supabase/supabase-js/dist/umd/supabase.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="../js/dashboard-student.js"></script>
    <script type="module" src="../js/profile.js"></script>

</body>

</html>
