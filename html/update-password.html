<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot-password</title>
    <link href="../src/output.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
        rel="stylesheet">
</head>

<body style="font-family: 'Sarabun', sans-serif;" class="bg-slate-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">ตั้งรหัสผ่านใหม่</h2>

        <div class="mb-5">
            <label for="new-password" class="block text-xs text-gray-500 mb-2 font-medium">รหัสผ่านใหม่</label>
            <input type="password" id="new-password"
                class="w-full border border-gray-200 rounded-lg px-4 py-1 focus:outline-none focus:ring-2 focus:ring-[#213f8c] focus:border-transparent transition-all"
                required>
        </div>

        <div class="mb-5">
            <label for="confirm-password"
                class="block text-xs text-gray-500 mb-2 font-medium">ยืนยันรหัสผ่านใหม่</label>
            <input type="password" id="confirm-password"
                class="w-full border border-gray-200 rounded-lg px-4 py-1 focus:outline-none focus:ring-2 focus:ring-[#213f8c] focus:border-transparent transition-all"
                required>
            <span id="password_error" class="text-red-500 text-xs mt-1 hidden">กรุณากรอกรหัสผ่าน</span>
        </div>

        <button type="button" id="update-btn"
            class="w-full bg-[#213f8c] text-white font-semibold rounded-lg py-2 hover:bg-[#082570] transition-colors duration-200 cursor-pointer">
            รีเซ็ตรหัสผ่าน
        </button>
    </div>

    <script type="module" src="../js/reset-password.js"></script>

</body>

</html>
